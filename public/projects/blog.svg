<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101522"/>
      <stop offset="1" stop-color="#1b2436"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <rect x="0" y="0" width="800" height="44" fill="#141b2b"/>
  <circle cx="24" cy="22" r="6" fill="#ef4444"/>
  <circle cx="46" cy="22" r="6" fill="#f59e0b"/>
  <circle cx="68" cy="22" r="6" fill="#4ade80"/>
  <rect x="200" y="90" width="400" height="26" rx="6" fill="#e2e8f0" opacity="0.9"/>
  <rect x="260" y="130" width="280" height="12" rx="4" fill="#64748b"/>
  <rect x="140" y="180" width="520" height="10" rx="4" fill="#334155"/>
  <rect x="140" y="200" width="520" height="10" rx="4" fill="#334155"/>
  <rect x="140" y="220" width="440" height="10" rx="4" fill="#334155"/>
  <rect x="140" y="260" width="520" height="120" rx="10" fill="#0d1420" stroke="#243247"/>
  <text x="160" y="295" font-family="monospace" font-size="14" fill="#4ade80">const posts = await getPosts()</text>
  <text x="160" y="320" font-family="monospace" font-size="14" fill="#94a3b8">posts.sort(byDate)</text>
  <text x="160" y="345" font-family="monospace" font-size="14" fill="#94a3b8">return render(posts)</text>
  <rect x="140" y="400" width="520" height="10" rx="4" fill="#334155"/>
  <rect x="140" y="420" width="380" height="10" rx="4" fill="#334155"/>
  <text x="400" y="475" font-family="sans-serif" font-size="20" fill="#e2e8f0" font-weight="bold" text-anchor="middle">Blog Personal</text>
</svg>
